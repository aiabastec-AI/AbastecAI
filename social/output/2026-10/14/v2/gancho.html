<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Space Grotesk"; src: url("../../../../assets/fonts/SpaceGrotesk-Variable.ttf"); font-weight: 300 700; }
  @font-face { font-family: "InterX"; src: url("../../../../assets/fonts/Inter-ExtraBold.ttf"); font-weight: 800; }
  html, body { margin: 0; background: #0D0F12; }
  #quadro { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0D0F12; font-family: "Space Grotesk", sans-serif; }
  .glow { position: absolute; border-radius: 50%; filter: blur(120px); }
  #g1 { width: 760px; height: 760px; right: -240px; top: 120px; background: #FF7A1A; opacity: .26; }
  #g2 { width: 820px; height: 820px; left: -300px; bottom: 120px; background: #2FD9C4; opacity: .22; }
  svg.rua { position: absolute; inset: 0; }
  .pin { position: absolute; width: 150px; height: 190px; }
  #texto { position: absolute; left: 80px; top: 300px; width: 770px; }
  #rotulo { font-weight: 700; font-size: 34px; letter-spacing: 5px; color: #2FD9C4; text-transform: uppercase; margin-bottom: 26px; }
  #titulo { font-weight: 700; font-size: 112px; line-height: 1.02; letter-spacing: -3px; color: #FFFFFF; }
  #titulo .o { color: #FF7A1A; position: relative; display: inline-block; }
  #titulo .o::after { content: ""; position: absolute; left: 0; right: 0; bottom: -14px; height: 10px; border-radius: 6px; background: #FF7A1A; }
  #sub { margin-top: 56px; font-weight: 500; font-size: 44px; line-height: 1.3; color: #B8BEC7; }
  #sub b { color: #FFFFFF; font-weight: 700; }
  #marca { position: absolute; left: 20px; top: 1010px; width: 860px; display: flex; align-items: center; gap: 0px; }
  #marca img { width: 400px; height: 400px; object-fit: contain; margin: -90px -60px -90px 0; }
  #marca .nome { font-weight: 700; font-size: 88px; letter-spacing: -2px; color: #FFFFFF; }
  #marca .nome span { color: #00B4D6; }
  #marca .tag { font-weight: 500; font-size: 32px; color: #8A9099; letter-spacing: 1px; margin-top: 6px; }
</style>
</head>
<body>
<div id="quadro">
  <div class="glow" id="g1"></div>
  <div class="glow" id="g2"></div>

  <!-- ruas do mapa (linhas finas) -->
  <svg class="rua" viewBox="0 0 1080 1920" fill="none" stroke="#262B33" stroke-width="3">
    <path d="M-40 520 L1120 380"/><path d="M-40 1020 L1120 900"/><path d="M-40 1560 L1120 1480"/>
    <path d="M180 -40 L260 1960"/><path d="M620 -40 L560 1960"/><path d="M960 -40 L900 1960"/>
    <path d="M-40 260 L420 1960" stroke-opacity=".6"/>
  </svg>

  <!-- pins no estilo do app (fora da zona do texto) -->
  <svg class="pin" id="p1" style="left:870px;top:130px" viewBox="0 0 150 190">
    <circle cx="75" cy="75" r="62" fill="#171A1F" stroke="#3DD68C" stroke-width="12"/>
    <text x="75" y="95" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="52" fill="#3DD68C">4.8</text>
    <rect x="69" y="136" width="12" height="46" rx="6" fill="#3DD68C"/>
  </svg>
  <svg class="pin" id="p2" style="left:30px;top:1500px" viewBox="0 0 150 190">
    <circle cx="75" cy="75" r="62" fill="#171A1F" stroke="#F5A623" stroke-width="12"/>
    <text x="75" y="95" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="52" fill="#F5A623">3.1</text>
    <rect x="69" y="136" width="12" height="46" rx="6" fill="#F5A623"/>
  </svg>
  <svg class="pin" id="p3" style="left:850px;top:560px" viewBox="0 0 150 190">
    <circle cx="75" cy="75" r="62" fill="#171A1F" stroke="#2FD9C4" stroke-width="12"/>
    <path d="M82 36 L52 82 H72 L66 116 L100 66 H78 Z" fill="#2FD9C4"/>
    <rect x="69" y="136" width="12" height="46" rx="6" fill="#2FD9C4"/>
  </svg>

  <div id="texto">
    <div id="rotulo">Dado público da ANP</div>
    <div id="titulo">Nota de posto<br>não é <span class="o">opinião</span></div>
    <div id="sub">Ela vem do <b>histórico de fiscalização</b>, não de estrelinhas.</div>
  </div>

  <div id="marca">
    <img src="../../../../assets/logo-app-icone-transparente.png" alt="">
    <div>
      <div class="nome">Abastec<span>AI</span></div>
      <div class="tag">Combustível e elétrico no mesmo mapa</div>
    </div>
  </div>
</div>

<script>
  window.META = { W: 1080, H: 1920, FPS: 30, DURATION: 3 };
  const pins = ["p1", "p2", "p3"].map(id => document.getElementById(id));
  // o texto fica 100% estático desde o quadro 0; só os pins flutuam de leve
  function render(t) {
    pins.forEach((p, i) => {
      const dy = Math.sin(t * 2.2 + i * 1.7) * 14;
      const rot = Math.sin(t * 1.4 + i) * 3;
      p.style.transform = `translateY(${dy}px) rotate(${rot}deg)`;
    });
  }
  render(0);
  Promise.all([document.fonts.load('700 100px "Space Grotesk"'), document.fonts.load('500 40px "Space Grotesk"'),
    ...Array.from(document.images).map(im => im.decode ? im.decode().catch(() => {}) : null)])
    .then(() => { window.READY = true; });
</script>
</body>
</html>
